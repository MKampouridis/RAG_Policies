<!doctype html><meta charset="utf-8"><title>Feedback</title>
<link rel="stylesheet" href="/static/dash.css">
<style>
/* Only what is specific to this page; everything shared lives in dash.css. */
.item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin-bottom:13px}
.item.down{border-left:4px solid var(--bad)}
.item.up{border-left:4px solid var(--good)}
.meta{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-bottom:7px;flex-wrap:wrap}
.who{font-weight:700;color:var(--v)}
.q{font-weight:600;margin:0 0 8px;font-size:15px}
.comment{background:#fffbe6;border-left:3px solid #e0c200;border-radius:6px;padding:8px 11px;font-size:13.5px;margin:8px 0}
.quote{border-left:3px solid #e0c200;background:#fffbe6;border-radius:6px;padding:9px 12px;margin-bottom:9px}
.quote .said{font-size:13.5px;margin:0 0 4px}
.quote .on{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quote .on b{color:#1a1620;font-weight:600}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filters button{font:inherit;font-size:13px;padding:6px 13px;border:1px solid var(--line);
  background:#fff;border-radius:999px;cursor:pointer}
.filters button.on{background:var(--v);color:#fff;border-color:var(--v)}
.filters select{font:inherit;font-size:13px;padding:5px 9px;border:1px solid var(--line);
  border-radius:7px;background:#fff}
.filters .count{font-size:12.5px;color:var(--muted);align-self:center;margin-left:auto}
details{margin-top:9px}summary{cursor:pointer;font-size:13px;color:var(--v)}
.a{white-space:pre-wrap;background:#fbfbfc;border:1px solid var(--line);border-radius:7px;
  padding:10px 12px;font-size:13.5px;margin-top:7px;max-height:300px;overflow:auto}
.srcs{font-size:12px;color:var(--muted);margin-top:7px;word-break:break-all}
.actions{margin-top:9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actions button{font:inherit;font-size:12.5px;padding:5px 12px;border:1px solid var(--v);background:#fff;
  color:var(--v);border-radius:7px;cursor:pointer}
.actions button:hover:not(:disabled){background:var(--v);color:#fff}
.actions button:disabled{opacity:.5;cursor:default}
.actions .hint{font-size:11.5px;color:var(--muted)}
.replay{margin-top:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.replay .head{padding:7px 12px;font-size:12.5px;font-weight:600;background:#f1edf4;color:var(--v)}
.replay .head.better{background:#e7f3e8;color:#1b5e20}
.replay .head.same{background:#fdeaea;color:#8c1d18}
.replay .body{padding:11px 12px}
.replay .cols{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:640px){.replay .cols{grid-template-columns:1fr}}
.replay h4{margin:0 0 5px;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.replay .txt{white-space:pre-wrap;font-size:13px;background:#fbfbfc;border:1px solid var(--line);
  border-radius:6px;padding:9px 10px;max-height:260px;overflow:auto}
.delta{font-size:12.5px;margin-top:9px}
.delta .gain{color:#1b5e20}.delta .lost{color:#8c1d18}
.warn{background:#fff4e5;border-left:3px solid var(--warn);border-radius:6px;padding:7px 10px;
  font-size:12.5px;margin-top:8px}
</style>
<div id="hdr"></div>

<main>
  <div id="dash"></div>
  <div class="filters">
    <button data-f="down" class="on">Thumbs down</button>
    <button data-f="up">Thumbs up</button>
    <button data-f="all">All</button>
    <button data-f="comment">With a comment</button>
    <select id="fTag"><option value="">Any tag</option></select>
    <select id="fGen"><option value="">Any generator</option></select>
    <select id="fAge">
      <option value="">Any date</option>
      <option value="7">Last 7 days</option>
      <option value="30">Last 30 days</option>
      <option value="90">Last 90 days</option>
    </select>
    <span class="count" id="shownCount"></span>
  </div>
  <div id="list"><div class="empty">loading…</div></div>
</main>
<script src="/static/dash.js"></script>
<script>
document.getElementById('hdr').innerHTML = dashHeader('/feedback');
let rows = [], filter = 'down';
const sel = {tag:'', gen:'', age:'', doc:''};
// Replay results, keyed by row index, so re-rendering after a filter change
// does not throw away a replay the user just paid a generation for.
const replays = {};

function matches(r){
  if(filter==='down' && r.rating!=='down') return false;
  if(filter==='up' && r.rating!=='up') return false;
  if(filter==='comment' && !(r.comment||'').trim()) return false;
  if(sel.tag && !(r.tags||[]).includes(sel.tag)) return false;
  if(sel.gen && ((r.provenance||{}).generator||'(not recorded)')!==sel.gen) return false;
  if(sel.age){
    const t = Date.parse(r.timestamp);
    if(isNaN(t) || t < Date.now() - sel.age*864e5) return false;
  }
  // Cross-filter: clicking a document bar narrows the list below to the
  // ratings that cited it. The panels and the list were disconnected, so
  // reading a panel meant scrolling down and hunting for the rows by hand.
  if(sel.doc && !(r.sources||[]).some(u=>fileOf(u)===sel.doc)) return false;
  return true;
}

function render(){
  const el = document.getElementById('list');
  const shown = rows.map((r,i)=>[r,i]).filter(([r])=>matches(r));
  document.getElementById('shownCount').textContent =
    `${shown.length} of ${rows.length} shown`;
  if(!shown.length){ el.innerHTML='<div class="empty">Nothing matches these filters.</div>'; return; }
  el.innerHTML = shown.map(([r,i]) => `
    <div class="item ${esc(r.rating)}">
      <div class="meta">
        <span class="who">${esc(r.owner || 'unknown')}</span>
        <span>${esc(when(r.timestamp))}</span>
        <span>${r.rating==='down'?'▼ down':'▲ up'}</span>
        ${r.provenance ? `<span>${esc(r.provenance.generator||'')} · corpus ${esc((r.provenance.corpus_version||'').slice(0,7))}</span>` : ''}
        ${r.source==='server' ? '' : '<span title="recorded from the client copy">client-recorded</span>'}
      </div>
      <p class="q">${esc(r.question)}</p>
      ${r.comment ? `<div class="comment">${esc(r.comment)}</div>` : ''}
      ${(r.tags&&r.tags.length) ? `<div class="tags">${r.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>` : ''}
      <details><summary>Answer and sources</summary>
        <div class="a">${esc(r.answer)}</div>
        ${r.retrieval_query && r.retrieval_query!==r.question ? `<div class="srcs"><b>Searched for:</b> ${esc(r.retrieval_query)}</div>`:''}
        <div class="srcs"><b>Sources:</b> ${(r.sources||[]).map(s=>
          `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(fileOf(s))}</a>`).join(', ')||'none'}</div>
        ${(r.ranked_top_urls&&r.ranked_top_urls.length) ? `<div class="srcs"><b>Top retrieved:</b> ${
          r.ranked_top_urls.map(u=>esc(fileOf(u))).join(', ')}</div>`:''}
      </details>
      <div class="actions">
        <button data-replay="${i}">Replay against today's index</button>
        <span class="hint">re-asks the question now &middot; one generation on the free tier,
          never falls back to a paid model</span>
      </div>
      ${replays[i] ? replayHTML(replays[i], r) : ''}
    </div>`).join('');
  el.querySelectorAll('[data-replay]').forEach(b=>{ b.onclick = ()=>doReplay(+b.dataset.replay, b); });
}

// ---- replay -------------------------------------------------------------
// A follow-up turn ("anything on the actual process of making the switch?")
// means nothing on its own, so replaying it standalone answers a DIFFERENT
// question from the one that was rated and any verdict from it is worthless.
// retrieval_query differing from question is the tell that the contextualizer
// ran, i.e. that this was a follow-up - and the rewrite it produced IS the
// resolved standalone form, so that is what gets replayed instead.
function replayTarget(r){
  const rq = (r.retrieval_query||'').trim();
  return (rq && rq !== (r.question||'').trim()) ? rq : (r.question||'').trim();
}
async function doReplay(i, btn){
  const r = rows[i];
  btn.disabled = true; btn.textContent = 'Asking…';
  try{
    const res = await fetch('/api/feedback/replay', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question: replayTarget(r),
                            previous_answer: r.answer || '',
                            previous_sources: r.sources || []})});
    if(!res.ok){
      // The server's detail says WHY (quota exhausted, and that replays do not
      // fall back to a paid model). "HTTP 503" would send the reader hunting
      // through a log for something the response already told them.
      let detail = 'HTTP '+res.status;
      try{ const j = await res.json(); if(j && j.detail) detail = j.detail; }catch(e2){}
      throw new Error(detail);
    }
    replays[i] = await res.json();
  }catch(e){
    replays[i] = {error: e.message || String(e)};
  }
  render();
}
function replayHTML(res, r){
  if(res.error) return `<div class="replay"><div class="head same">Replay failed</div>
    <div class="body"><div class="txt">${esc(res.error)}</div></div></div>`;
  const gained = res.sources_gained||[], lost = res.sources_lost||[];
  // Deliberately NOT a verdict of "fixed": only the person who wrote the
  // complaint can say whether the new answer answers it. The heading reports
  // what measurably changed and leaves the judgement to the reader.
  const changed = gained.length || lost.length || !res.answer_identical;
  const cls = changed ? 'better' : 'same';
  const head = changed
    ? `Answer has changed since this was rated — read both and decide`
    : `Unchanged: same sources, same answer. Still broken.`;
  const rewritten = replayTarget(r) !== (r.question||'').trim();
  return `<div class="replay">
    <div class="head ${cls}">${head}</div>
    <div class="body">
      ${rewritten ? `<div class="warn">This was a follow-up, so the raw question
        (&ldquo;${esc(r.question)}&rdquo;) means nothing on its own. Replayed the
        contextualizer's resolved form instead: <b>${esc(replayTarget(r))}</b></div>` : ''}
      <div class="cols">
        <div><h4>Then &middot; ${esc(when(r.timestamp))}</h4><div class="txt">${esc(r.answer)}</div></div>
        <div><h4>Now &middot; ${esc(res.seconds)}s &middot; ${esc((res.provenance||{}).generator||'')}</h4>
             <div class="txt">${esc(res.answer)}</div></div>
      </div>
      <div class="delta">
        ${gained.length?`<div class="gain">+ now cites: ${gained.map(esc).join(', ')}</div>`:''}
        ${lost.length?`<div class="lost">− no longer cites: ${lost.map(esc).join(', ')}</div>`:''}
        ${(!gained.length&&!lost.length)?`<div>Same documents cited.</div>`:''}
      </div>
    </div></div>`;
}
// ---- dashboard ---------------------------------------------------------
// Diagnostic first: every panel answers "where do I act next", and the
// aggregates deliberately carry no names - this page is shareable, and a
// per-person scoreboard of colleagues' complaints is not what it is for.
const LEVER = {
  wrong_programme: 'retrieval / clarification of under-specified questions',
  wrong_figure:    'generator - a figure not supported by the retrieved text',
  outdated:        'data hygiene - stale edition, exclude the URL and re-crawl',
  no_answer:       'abstention or under-specified - retrieval coverage',
  other:           'read the comments',
};
function weekOf(ts){
  const d = new Date(ts); if(isNaN(d)) return null;
  const m = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  m.setUTCDate(m.getUTCDate() - ((m.getUTCDay()+6)%7));   // ISO Monday
  return m.toISOString().slice(0,10);
}
function panelTrend(){
  const w = {};
  rows.forEach(r=>{ const k=weekOf(r.timestamp); if(!k) return;
    (w[k] = w[k] || {up:0,down:0})[r.rating==='down'?'down':'up']++; });
  const keys = Object.keys(w).sort();
  if(!keys.length) return '';
  const body = keys.map(k=>{
    const {up,down} = w[k];
    return `<div class="row"><span class="lbl">${k}</span>${bar(down,up)}`+
           `<span class="n">${pct(up,up+down)}% up · ${up+down}</span></div>`;
  }).join('');
  return `<div class="panel wide"><h2>Satisfaction over time</h2>
    <p class="why">Weekly. The panel that most rewards volume - a change that helps should show up here.</p>
    ${body}</div>`;
}
// The written comments are the densest signal in the log - "you gave a
// document from a partner institution (Kaplan)" names a mechanism, where a
// tag of `other` names nothing. They were only visible one-per-row below the
// dashboard and behind the down filter, so a reader had to already be
// scrolling to find them. Newest first, capped, with a click through to the
// full row.
function panelComments(){
  const withC = rows.filter(r=>(r.comment||'').trim());
  if(!withC.length) return '';
  const body = withC.slice(0,8).map(r=>`
    <div class="quote">
      <p class="said">${r.rating==='down'?'▼':'▲'} &ldquo;${esc(r.comment)}&rdquo;</p>
      <div class="on">on <b>${esc(r.question)}</b></div>
    </div>`).join('');
  return `<div class="panel wide"><h2>What people wrote</h2>
    <p class="why">Free text says what the tags cannot. ${withC.length} of ${rows.length}
      ratings carry a comment${withC.length>8?`; the 8 most recent are shown`:''} -
      use the &ldquo;With a comment&rdquo; filter below for all of them.</p>
    ${body}</div>`;
}
function panelTags(){
  const c = {};
  rows.filter(r=>r.rating==='down').forEach(r=>(r.tags||[]).forEach(t=>c[t]=(c[t]||0)+1));
  const keys = Object.keys(c).sort((a,b)=>c[b]-c[a]);
  const untagged = rows.filter(r=>r.rating==='down' && !(r.tags||[]).length).length;
  if(!keys.length && !untagged) return '';
  const max = Math.max(...keys.map(k=>c[k]), 1);
  const body = keys.map(k=>
    `<div class="row"><span class="lbl">${esc(k)}</span>
       <div class="bar-track"><div class="dn" style="width:${c[k]/max*100}%"></div></div>
       <span class="n">${c[k]}</span></div>
     <div class="lever">&rarr; ${esc(LEVER[k]||'')}</div>`).join('');
  return `<div class="panel"><h2>Why answers were rejected</h2>
    <p class="why">Thumbs-down by failure tag, each routed to the lever that would fix it.</p>
    ${body}${untagged?`<div class="sparse">${untagged} thumbs-down carried no tag.</div>`:''}</div>`;
}
function panelDocs(){
  const c = {};
  rows.forEach(r=>{
    const seen = new Set((r.sources||[]).map(s=>String(s).split('/').pop()));
    seen.forEach(f=>{ const e = c[f] = c[f] || {up:0,down:0};
      e[r.rating==='down'?'down':'up']++; });
  });
  const keys = Object.keys(c).filter(k=>c[k].down>0)
    .sort((a,b)=>c[b].down-c[a].down || (c[b].down+c[b].up)-(c[a].down+c[a].up)).slice(0,10);
  if(!keys.length) return '';
  const body = keys.map(k=>
    `<div class="row pickable${sel.doc===k?' picked':''}" data-doc="${esc(k)}">
       <span class="lbl" title="${esc(k)}">${esc(k)}</span>
       ${bar(c[k].down, c[k].up)}
       <span class="n">${c[k].down}▼ ${c[k].up}▲</span></div>`).join('');
  return `<div class="panel"><h2>Documents in rejected answers</h2>
    <p class="why">Cited when a user said the answer was wrong. A document that is all red is
      worth opening. <b>Click one</b> to filter the list below to its ratings.</p>
    ${body}${sel.doc?`<div class="lever">&rarr; filtered to <b>${esc(sel.doc)}</b> — click again to clear</div>`:''}</div>`;
}
function panelProvenance(){
  const by = (keyFn, label) => {
    const c = {};
    rows.forEach(r=>{ const k = keyFn(r); if(!k) return;
      const e = c[k] = c[k] || {up:0,down:0}; e[r.rating==='down'?'down':'up']++; });
    const keys = Object.keys(c).sort();
    if(!keys.length) return '';
    return `<tr><th colspan="3">${label}</th></tr>` + keys.map(k=>{
      const {up,down}=c[k];
      return `<tr><td>${esc(k)}</td><td>${bar(down,up)}</td>`+
             `<td class="n">${pct(up,up+down)}% up · ${up+down}</td></tr>`;
    }).join('');
  };
  const gen = by(r=>(r.provenance||{}).generator, 'By generator');
  const cor = by(r=>((r.provenance||{}).corpus_version||'').slice(0,7), 'By corpus version');
  const missing = rows.filter(r=>!(r.provenance||{}).generator).length;
  const have = rows.length - missing;
  if(!gen && !cor) return '';
  // The denominator goes in the subtitle, not a footnote: provenance was added
  // after most of this log was collected, so this panel can be drawing three
  // points while looking exactly like the ones drawn on all 38.
  return `<div class="panel"><h2>By model and corpus</h2>
    <p class="why">Whether a model or corpus change moved real user reactions, not just eval
      scores. <b>Based on ${have} of ${rows.length} ratings</b> — the rest predate provenance
      recording${have < 10 ? ', so this is too thin to read yet' : ''}.</p>
    <table class="prov">${gen}${cor}</table>
    ${missing?`<div class="sparse">${missing} ratings excluded: no provenance recorded.</div>`:''}</div>`;
}
// How the answer opens is the reliable signal. Mid-answer hedging ("I don't
// have COMPLETE rules for...", "based on what I can see...") appears in plenty
// of substantive answers, so matching anywhere in the text misclassifies them
// as abstentions. Heuristic either way, and labelled as one.
// Phrasing varies across the log because these records straddle the
// introduction of USER_FACING_LANGUAGE: older answers say "the provided
// context does not contain X", newer ones "the policies I can see don't
// cover X". Both are the same event and both must match.
const ABSTAIN_RE = new RegExp([
  "(don'?t|do not|does not|doesn'?t) (have|contain|include|cover|specify|mention|address)",
  "policies i can see don'?t cover",
  "(can'?t|cannot|could not|couldn'?t|unable to) (find|locate|answer|determine)",
  "no (information|details|document|mention) (on|about|regarding|of)",
  "not (covered|specified|stated|mentioned|available) (by|in|within)?",
  "i (don'?t|do not) have",
].join("|"), "i");
function abstained(a){ return ABSTAIN_RE.test(String(a||'').slice(0,300)); }

function panelAbstain(){
  const down = rows.filter(r=>r.rating==='down');
  if(!down.length) return '';
  const ab = down.filter(r=>abstained(r.answer)).length;
  const wrong = down.length - ab;
  return `<div class="panel"><h2>Rejected: missing vs wrong</h2>
    <p class="why">Of the thumbs-down, how many were the system saying it couldn't answer
      versus answering confidently. They need different fixes.</p>
    <div class="row"><span class="lbl">Couldn't answer</span>
      <div class="bar-track"><div class="dn" style="width:${pct(ab,down.length)}%"></div></div>
      <span class="n">${ab}</span></div>
    <div class="lever">&rarr; corpus coverage - the document is missing or unreachable</div>
    <div class="row"><span class="lbl">Answered wrongly</span>
      <div class="bar-track"><div class="dn" style="width:${pct(wrong,down.length)}%"></div></div>
      <span class="n">${wrong}</span></div>
    <div class="lever">&rarr; retrieval ranking, or the generator</div>
    <div class="sparse">Heuristic: matched on how the answer opens, so treat as indicative.</div>
  </div>`;
}

function panelCoverage(ctx){
  if(!ctx) return '';
  const rated = rows.length, answers = ctx.answers || 0;
  const cov = pct(rated, answers);
  return `<div class="panel"><h2>What the ratings don't cover</h2>
    <p class="why">Ratings are self-selected - people click when annoyed - so every
      percentage above describes this share of answers, not all of them.</p>
    <div class="row"><span class="lbl">Answers rated</span>
      <div class="bar-track"><div class="up" style="width:${cov}%"></div></div>
      <span class="n">${cov}% · ${rated}/${answers}</span></div>
    <div class="row"><span class="lbl">Failed turns</span>
      <div class="bar-track"><div class="dn" style="width:${pct(ctx.failed_turns, answers)}%"></div></div>
      <span class="n">${ctx.failed_turns}</span></div>
    <div class="lever">&rarr; questions that never got an answer, so nobody could rate them</div>
    <div class="row"><span class="lbl">Repeated questions</span>
      <div class="bar-track"><div class="dn" style="width:${pct(ctx.repeat_questions, ctx.questions||1)}%"></div></div>
      <span class="n">${ctx.repeat_questions}</span></div>
    <div class="lever">&rarr; asked again in the same conversation - usually the first answer missed</div>
  </div>`;
}

let lastCtx = null;
function renderDash(ctx){
  lastCtx = ctx;
  const panels = [panelComments(), panelTrend(), panelTags(), panelDocs(), panelAbstain(),
                  panelCoverage(ctx), panelProvenance()].filter(Boolean);
  const dash = document.getElementById('dash');
  dash.innerHTML = panels.length ? `<div class="panels">${panels.join('')}</div>` : '';
  dash.querySelectorAll('[data-doc]').forEach(el=>{
    el.onclick = ()=>{
      sel.doc = (sel.doc === el.dataset.doc) ? '' : el.dataset.doc;  // click again to clear
      renderDash(lastCtx); render();
    };
  });
}

document.querySelectorAll('.filters button').forEach(b=>{
  b.onclick=()=>{ filter=b.dataset.f;
    document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('on',x===b));
    render(); };
});
document.getElementById('fTag').onchange = e=>{ sel.tag = e.target.value; render(); };
document.getElementById('fGen').onchange = e=>{ sel.gen = e.target.value; render(); };
document.getElementById('fAge').onchange = e=>{ sel.age = e.target.value ? +e.target.value : ''; render(); };
// Options come from the data, so a tag or model that only appears once is
// still reachable and a vocabulary change needs no edit here.
function fillFilters(){
  const tags = [...new Set(rows.flatMap(r=>r.tags||[]))].sort();
  const gens = [...new Set(rows.map(r=>(r.provenance||{}).generator||'(not recorded)'))].sort();
  const opt = (v)=>`<option value="${esc(v)}">${esc(v)}</option>`;
  document.getElementById('fTag').innerHTML = '<option value="">Any tag</option>' + tags.map(opt).join('');
  document.getElementById('fGen').innerHTML = '<option value="">Any generator</option>' + gens.map(opt).join('');
}
// limit raised from the endpoint's default of 200: the dashboard aggregates
// every rating it is given, so silently truncating would make the percentages
// wrong - and wrong quietly - once colleagues push the volume past 200.
fetch('/api/feedback?limit=100000').then(r=>r.json()).then(d=>{
  rows=d;
  const up=rows.filter(r=>r.rating==='up').length, down=rows.filter(r=>r.rating==='down').length;
  const people=new Set(rows.map(r=>r.owner).filter(Boolean));
  document.getElementById('stats').innerHTML =
    `<span><b>${rows.length}</b> ratings</span><span><b>${down}</b> down</span>`+
    `<span><b>${up}</b> up</span><span><b>${pct(up,up+down)}%</b> positive</span>`+
    `<span><b>${people.size}</b> ${people.size===1?'person':'people'}</span>`+
    `<span><b>${rows.filter(r=>r.comment).length}</b> with comments</span>`;
  // the context call is additive: if it fails the dashboard still renders,
  // just without the coverage panel
  fetch('/api/feedback/context').then(r=>r.json()).then(ctx=>renderDash(ctx))
    .catch(()=>renderDash(null));
  fillFilters();
  render();
}).catch(e=>{ document.getElementById('list').innerHTML='<div class="empty">Could not load feedback: '+esc(e)+'</div>'; });
</script>
